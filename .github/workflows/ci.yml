name: CI

on: [push, pull_request]

env:
  BLASTDB: blast-db
  BLAST_DATABASES: "ref_viruses_rep_genomes ref_prok_rep_genomes"
  # The full ref_prok_rep_genomes download (about 25 GB) no longer fits on the runner, so CI fetches only the
  # database-level index files plus the one volume holding the E. coli test accession NC_000913.3. If NCBI moves
  # that accession to another volume, the tests fail on NC_000913.3; update the volume number here. To find it, with
  # the full database downloaded: for v in ref_prok_rep_genomes.??; do blastdbcmd -db $v -entry NC_000913.3 \
  #   -outfmt "$v %a" 2>/dev/null; done
  BLAST_DB_INCLUDES: "ref_viruses_rep_genomes* ref_prok_rep_genomes.n* ref_prok_rep_genomes.19.*"
  FETCH_REFSEQ_ASSEMBLIES: "Mumps orthorubulavirus"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 8
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python prerequisites
      run: pip3 install build wheel ruff setuptools marisa-trie
    - name: Lint
      run: make lint
    - name: Install BLAST
      run: sudo apt-get install --yes ncbi-blast+
    - name: Add placeholder file
      run: cp test/sample_wikipedia_extract.json wikipedia_extracts.json
    - name: Build and install database packages
      run: make install-db-packages
    - name: Build and install package
      run: make install
    - name: Test
      run: make test
  black:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
  isort:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: isort/isort-action@v1.1.0
